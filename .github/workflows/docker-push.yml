name: docker-push
'on':
  push:
    branches:
    - main
    paths:
    - Dockerfile
    - go.mod
    - go.sum
    - public/**
    - .github/workflows/docker-push.yml
  workflow_dispatch: {}
concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Prepare image names
      id: images
      run: echo "ghcr=$(echo ghcr.io/${GITHUB_REPOSITORY,,})" >> "${GITHUB_OUTPUT}"
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.images.outputs.ghcr }}
        tags:
        - type=raw,value=latest,enable={{is_default_branch}}
        - type=sha
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Prune old GHCR versions
      env:
        GHCR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\nif [ -z \"${GHCR_PAT:-}\" ]; then\n  echo \"no GHCR_PAT\
        \ set; skipping prune\"\n  exit 0\nfi\n# Keep only the just-built version\
        \ (sha-<commit>) plus latest tag.\nKEEP=\"sha-${GITHUB_SHA:0:7}\"\nOWNER=\"\
        ${GITHUB_REPOSITORY_OWNER}\"\nIMG=\"${GITHUB_REPOSITORY#*/}\"\nIMG=\"${IMG,,}\"\
        \necho \"owner=$OWNER img=$IMG keep_tag=$KEEP\"\npython3 - \"$GHCR_PAT\" \"\
        $OWNER\" \"$IMG\" \"$KEEP\" <<'PY'\nimport sys, json, time, urllib.request\n\
        \npat, owner, img, keep = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]\n\
        base = f'https://api.github.com/users/{owner}/packages/container/{img}/versions'\n\
        headers = {'Authorization': 'Bearer ' + pat, 'Accept': 'application/vnd.github+json'}\n\
        req = urllib.request.Request(base + '?per_page=100', headers=headers)\nversions\
        \ = json.load(urllib.request.urlopen(req, timeout=30))\nto_delete = []\nfor\
        \ v in versions:\n    id_ = v.get('id')\n    if not id_:\n        continue\n\
        \    tags = (v.get('metadata') or {}).get('container', {}).get('tags') or\
        \ []\n    if keep in tags:\n        continue  # version we just pushed\n \
        \   if tags == ['latest']:\n        continue  # keep the newest latest marker\n\
        \    to_delete.append((id_, tags))\nprint('pruning:', [(i, t) for i, t in\
        \ to_delete])\nfor id_, tags in to_delete:\n    url = base + '/' + str(id_)\n\
        \    rq = urllib.request.Request(url, headers=headers, method='DELETE')\n\
        \    try:\n        code = urllib.request.urlopen(rq, timeout=30).status\n\
        \        print('deleted', id_, tags, '->', code)\n    except Exception as\
        \ e:\n        print('skip', id_, tags, 'err:', e)\n    time.sleep(0.4)\nPY"
