name: diag-token
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Print GITHUB_TOKEN oauth-scopes header
        run: |
          curl -s -D - -o /dev/null -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user | grep -i '^x-oauth-scopes:' || echo "no x-oauth-scopes header"
          echo "actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY"
      - name: Probe ghcr write token
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          RESP=$(curl -s -o /dev/null -w "%{http_code}" -u "${GITHUB_ACTOR}:$GITHUB_TOKEN" "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:push,pull")
          echo "ghcr_push_token_http=$RESP"
