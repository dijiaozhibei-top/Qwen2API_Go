name: diag-token2
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: GHCR push-scope probe (pure curl, no docker)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" \
            -u "${GITHUB_ACTOR}:$GITHUB_TOKEN" \
            "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:push,pull")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1 | head -c 200)
          echo "ghcr_push_probe_http=$CODE"
          echo "ghcr_push_probe_body=${BODY}"
          # Also probe write_package via actual docker buildx needs auth; instead check registry v2 auth challenge
          curl -s -o /dev/null -w "v2_anon=%{http_code}\n" "https://ghcr.io/v2/"
